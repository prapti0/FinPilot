server:
  port: 8082

spring:
  application:
    name: portfolio-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/finpilot
    username: finpilot
    password: finpilot
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  cache:
    type: redis

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus