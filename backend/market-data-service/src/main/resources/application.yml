server:
  port: 8085

spring:
  application:
    name: market-data-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/finpilot
    username: finpilot
    password: finpilot
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

finpilot:
  market:
    quote-cache-ttl-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus