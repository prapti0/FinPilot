server:
  port: 8086

spring:
  application:
    name: risk-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/finpilot
    username: finpilot
    password: finpilot
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092

finpilot:
  services:
    portfolio: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus