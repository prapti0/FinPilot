server:
  port: 8084

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/finpilot
    username: finpilot
    password: finpilot
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  kafka:
    bootstrap-servers: localhost:9092

finpilot:
  reconciliation:
    interval-ms: 900000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus