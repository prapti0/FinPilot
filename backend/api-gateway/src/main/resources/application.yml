server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/accounts/**, /api/v1/monitoring/**
        - id: portfolio-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/portfolios/**
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**
        - id: transaction-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/transactions/**
        - id: market-data-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/market/**
        - id: risk-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/risk/**
        - id: ai-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/ai/**

finpilot:
  jwt-secret: ${JWT_SECRET:finpilot-dev-secret-change-in-production-32chars}
  rate-limit:
    requests-per-minute: ${FINPILOT_RATE_LIMIT:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${FINPILOT_TRACE_SAMPLE:0.2}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}