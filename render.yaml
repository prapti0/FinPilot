# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: finpilot-api
    runtime: docker
    dockerfilePath: ./infrastructure/render/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FINPILOT_EVENTS_KAFKA_ENABLED
        value: "false"
      - key: FINPILOT_CACHE_MODE
        value: simple
      - key: FINPILOT_RENDER_START_AI
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: FINPILOT_CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-db
          property: connectionString

databases:
  - name: finpilot-db
    databaseName: finpilot
    user: finpilot
    plan: starter